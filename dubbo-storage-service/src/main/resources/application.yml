spring:
  application:
    name: dubbo-storage-service
  main:
    web-application-type: reactive  # Netty 容器承载 Actuator 端点
  cloud:
    nacos:
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PWD:nacos}
      discovery:
        server-addr: ${nacos.address:localhost:8848}
  # Seata AT 使用的业务数据源（会被 Seata 自动代理）
  # H2 内存库 + MySQL 兼容模式：sample 免装 MySQL
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:seata_storage;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

dubbo:
  application:
    name: dubbo-storage-service
    logger: slf4j
    qos-enable: false
  protocol:
    name: dubbo
    port: 20883
    ext-protocol: tri
  scan:
    base-packages: com.example.dubbo.storage
  registry:
    address: nacos://${nacos.address:localhost}:8848?username=nacos&password=nacos

mybatis:
  configuration:
    map-underscore-to-camel-case: true

seata:
  enabled: true
  application-id: ${spring.application.name}
  # 事务组名，需与服务端 service.vgroup-mapping 中配置的组一致
  tx-service-group: demo_tx_group
  service:
    vgroup-mapping:
      # key=事务组名, value=TC 集群名（Seata Server 的 cluster，默认 default）
      demo_tx_group: default
    # 直连兜底：注册中心不可用时按此地址连 TC（生产可去掉）
    grouplist:
      default: ${seata.server:localhost}:8091
  registry:
    type: nacos
    nacos:
      server-addr: ${nacos.address:localhost}:8848
      namespace: ""
      group: SEATA_GROUP
      application: seata-server
  # 数据源自动代理（AT 模式核心开关，默认即 true，这里显式声明）
  enable-auto-data-source-proxy: true

management:
  server:
    port: 9003
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
