spring:
  application:
    name: dubbo-gateway
  cloud:
    nacos:
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PWD:nacos}
      discovery:
        server-addr: ${nacos.address:localhost:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: user_service_route
              uri: lb://dubbo-user-service
              predicates:
                - Path=/user/**

            - id: order_service_route
              uri: lb://dubbo-order-service
              predicates:
                - Path=/order/**

            - id: storage_service_route
              uri: lb://dubbo-storage-service
              predicates:
                - Path=/storage/**

server:
  port: 7788

# Sentinel 配置
sentinel:
  transport:
    dashboard: localhost:8080  # Sentinel Dashboard 地址
    port: 8719  # 与控制台通信的端口
  eager: true  # 启动时立即初始化

management:
  server:
    port: 9000            # 管理端点独立端口，不占用网关业务端口 7788
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway  # gateway 端点可查看路由表
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.alibaba.csp.sentinel: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: DEBUG
    org.springframework.web.reactive: DEBUG