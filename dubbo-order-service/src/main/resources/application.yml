spring:
  application:
    name: dubbo-order-service
  main:
    web-application-type: reactive  # 启动 Netty 容器承载 Actuator 端点（原 none 会导致端点不生效）
  cloud:
    nacos:
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PWD:nacos}
      discovery:
        server-addr: ${nacos.address:localhost:8848}
  # Seata AT 使用的业务数据源（会被 Seata 自动代理）
  # H2 内存库 + MySQL 兼容模式：sample 免装 MySQL；换 MySQL 时改回
  # jdbc:mysql://${mysql.host:localhost}:3306/seata_order?useUnicode=true&characterEncoding=utf8
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:seata_order;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# Seata AT 模式客户端配置
seata:
  enabled: false
  application-id: ${spring.application.name}
  # 事务组名，需与服务端 service.vgroup-mapping 中配置的组一致
  tx-service-group: demo_tx_group
  service:
    vgroup-mapping:
      # key=事务组名, value=TC 集群名（Seata Server 的 cluster，默认 default）
      demo_tx_group: default
    # 直连兜底：注册中心不可用时按此地址连 TC（生产可去掉）
    grouplist:
      default: ${seata.server:localhost}:8091
  registry:
    type: nacos
    nacos:
      server-addr: ${nacos.address:localhost}:8848
      namespace: ""
      group: SEATA_GROUP
      application: seata-server
  # 数据源自动代理（AT 模式核心开关，默认即 true，这里显式声明）
  enable-auto-data-source-proxy: true

dubbo:
  application:
    name: dubbo-order-service
    logger: slf4j
    qos-enable: false
    check-serializable: false
    serialize-check-status: DISABLE   # 开启白名单机制（serialize-check-status 设为 WARN 或 STRICT），明确只允许内部可信类的反序列化
  protocol:
    name: dubbo        # 主协议：服务间调用使用 dubbo
    port: 20881
    ext-protocol: tri  # 扩展协议：同端口额外支持 triple，供 gateway 调用
#    extension: com.example.dubbo.filter.SecurityFilterV1
    preferred-protocol: tri # 告诉消费端：如果你支持 tri，请优先用 tri 调用
  scan:
    base-packages: com.example.dubbo.order
  registry:
    address: nacos://${nacos.address:localhost}:8848
    username: ${NACOS_USER:nacos}
    password: ${NACOS_PWD:nacos}
    register-mode: instance  # 只注册应用级，不注册接口级

logging:
  level:
    "org.apache.dubbo.rpc.protocol.tri": debug
    "org.apache.dubbo.remoting": debug

management:
  server:
    port: 9001            # 管理端点独立端口，与 dubbo(20881)/tri 业务端口隔离
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

##############双注册#############################
# Nacos 中的服务名	类型	说明
# providers:com.example.dubbo.api.OrderService::	接口级地址	Dubbo2 兼容模式，按接口名注册
# dubbo-order-service	应用级地址	Dubbo3 新模式，按应用名注册