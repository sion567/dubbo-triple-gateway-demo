spring:
  application:
    name: dubbo-user-service
  main:
    web-application-type: reactive  # 启动 Netty 容器承载 Actuator 端点
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: 192.168.40.237:8848

dubbo:
  application:
    name: dubbo-user-service
    logger: slf4j
    qos-port: 22222
  protocol:
    name: dubbo
    port: 20882
    ext-protocol: tri
  scan:
    base-packages: com.example.dubbo.user
  registry:
    address: nacos://${nacos.address:192.168.40.237}:8848?username=nacos&password=nacos

management:
  server:
    port: 9002            # 管理端点独立端口，与 dubbo(20882)/tri 业务端口隔离
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always