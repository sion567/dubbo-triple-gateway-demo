# RocketMQ Broker 配置（sample 用途）
# 关键：brokerIP1 必须是客户端可达的 IP。
# 默认 127.0.0.1 适用于「docker 跑基础设施 + 应用跑宿主机」；
# 应用在其他机器时改成宿主机局域网 IP。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 自动建 topic（生产环境应关闭，改为预建）
autoCreateTopicEnable = true
# 宿主机可达地址（客户端从 NameServer 拿到它再连 Broker）
brokerIP1 = 127.0.0.1
listenPort = 10911
