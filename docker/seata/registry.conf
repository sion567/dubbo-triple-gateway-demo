# Seata Server 2.0 配置：注册到 Nacos，事务日志存本地文件（sample 用途，生产建议 db/redis 模式）
registry {
    type = "nacos"
    nacos {
        application = "seata-server"
        serverAddr = "nacos:8848"   # compose 网络内的服务名，应用侧不感知
        group = "SEATA_GROUP"
        namespace = ""
        cluster = "default"
        username = "nacos"
        password = "nacos"
    }
}

config {
    # sample 用 file 模式：配置全部在本文件内；生产建议 nacos 配置中心集中管理
    type = "file"
    file {
        name = "file:/seata-server/resources/file.conf"
    }
}
